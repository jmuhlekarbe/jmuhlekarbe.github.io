# ==================================================================
# MENTORING: postdocs and PhD students
# ==================================================================
# Four groups: current_postdocs, former_postdocs, current_phd,
# former_phd. Each person is one block that starts with "- name:".
#
#   name:    the person's name
#   url:     link to their homepage or LinkedIn (optional)
#   details: role, place and dates, as one line of text
#   thesis:  thesis title (optional, former PhD students)
#   thesis_url: link to the thesis (optional)
#   now:     current position (optional), e.g. "Assistant Professor at LSE"
#   previously: earlier position(s) after leaving (optional)
#
# When someone finishes: cut their block and paste it into the
# matching "former_" group, then add "now:".
# Keep the spaces at the start of each line exactly as they are.
# ==================================================================

